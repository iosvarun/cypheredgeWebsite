# Render Infrastructure-as-Code (Blueprint) for CypherEdge Website
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: cypheredge-website
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
