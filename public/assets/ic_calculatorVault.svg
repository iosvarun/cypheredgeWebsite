<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#000000" />
  
  <!-- Quadrants -->
  <!-- Top Left: Light Grey -->
  <rect x="0" y="0" width="252" height="252" fill="#E8E8E8" />
  <!-- Top Right: Bright Orange -->
  <rect x="260" y="0" width="252" height="252" fill="#F58220" />
  <!-- Bottom Left: Bright Orange -->
  <rect x="0" y="260" width="252" height="252" fill="#F58220" />
  <!-- Bottom Right: Light Grey -->
  <rect x="260" y="260" width="252" height="252" fill="#E8E8E8" />
  
  <!-- Top Left (+) -->
  <rect x="110" y="56" width="32" height="140" rx="6" fill="#000000" />
  <rect x="56" y="110" width="140" height="32" rx="6" fill="#000000" />
  
  <!-- Top Right (-) -->
  <rect x="316" y="110" width="140" height="32" rx="6" fill="#000000" />
  
  <!-- Bottom Left (x) -->
  <g transform="translate(126, 386) rotate(45)">
    <rect x="-16" y="-70" width="32" height="140" rx="6" fill="#000000" />
    <rect x="-70" y="-16" width="140" height="32" rx="6" fill="#000000" />
  </g>
  
  <!-- Bottom Right (=) -->
  <rect x="316" y="354" width="140" height="30" rx="6" fill="#000000" />
  <rect x="316" y="398" width="140" height="30" rx="6" fill="#000000" />
</svg>
